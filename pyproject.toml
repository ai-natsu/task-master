[project]
name = "taskmaster"
version = "2.0.0"
description = "TaskMaster デスクトップ版（Python + CustomTkinter）"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "tkcalendar>=1.6",
    "charset-normalizer>=3.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "nuitka>=2.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "gui: Tk の画面部品を実際に描画して検証するテスト（tests/gui）。画面を開けない環境ではスキップ",
    "e2e: アプリ全体を実際に動かして、画面遷移・操作を検証するテスト（tests/e2e）。画面を開けない環境ではスキップ",
]
