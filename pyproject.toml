[project]
name = "taskmaster"
version = "2.0.0"
description = "TaskMaster デスクトップ版（Python + CustomTkinter）"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "tkcalendar>=1.6",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "nuitka>=2.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
