<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"></head><body>
<div class="frame md" id="frame">
  <div data-comp="titlebar" data-text="プロジェクト作成／編集（モーダル）"></div>
  <div class="backdrop" style="padding:22px 28px">
    <div class="modal">
      <h2>新しいプロジェクト <span class="small muted" style="font-weight:400">／ 編集モード: プロジェクトを編集</span></h2>
      <label>名前</label>
      <div class="rel"><span class="input fill err"><i class="id">0501</i>プロジェクト名</span><div class="errtxt">名前を入力してください（未入力で保存したときだけ表示。入力すると消える）</div></div>
      <label>説明</label>
      <span class="input fill area"><i class="id">0502</i>説明（任意）</span>
      <label>カラー</label>
      <div class="row rel" style="gap:8px"><i class="id" style="left:46px;right:auto;top:-15px">0503</i>
        <span class="dot lg" style="background:#6366f1;width:22px;height:22px;box-shadow:0 0 0 2px #fff,0 0 0 4px #6366f1"></span><span class="dot lg" style="background:#22c55e;width:22px;height:22px"></span><span class="dot lg" style="background:#ef4444;width:22px;height:22px"></span><span class="dot lg" style="background:#f59e0b;width:22px;height:22px"></span><span class="dot lg" style="background:#0ea5e9;width:22px;height:22px"></span><span class="dot lg" style="background:#a855f7;width:22px;height:22px"></span><span class="dot lg" style="background:#ec4899;width:22px;height:22px"></span></div>
      <div class="errtxt rel" style="margin-top:12px"><i class="id" style="left:-6px;right:auto;top:-2px">0506</i>　　　保存に失敗した理由（失敗したときだけ、ボタンの上に赤字で表示）</div>
      <div class="btns"><span class="btn ghost rel"><i class="id">0505</i>キャンセル</span><span class="btn primary"><i class="id">0504</i>作成</span></div>
    </div>
  </div>
  <div class="legend">編集モードのボタンは「保存」。名前は開いたときにフォーカスされる。SCR-02 から開く。</div>
</div>
<script src="common.js"></script></body></html>
