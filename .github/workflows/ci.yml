name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main, "develop/**"]
  workflow_dispatch:
    inputs:
      coverage:
        description: "テストをカバレッジ計測ありで実行する"
        type: boolean
        default: false

# push / pull_request では COVERAGE は空 → カバレッジなし（高速）。
# 手動実行（Run workflow）時のチェックボックスで true にできる。
env:
  COVERAGE: ${{ inputs.coverage }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema server/prisma/schema.prisma

      # --- 静的解析（ESLint） ---
      # 当面は非ブロッキング（advisory）: 既存プロダクトコードは未対応のため、
      # 結果は表示するが CI は失敗させない。コード側をクリーンアップ後に
      # continue-on-error を外してマージゲート化する（docs/STATIC_ANALYSIS.md 参照）。
      - name: Lint (ESLint)
        run: npm run check
        continue-on-error: true

      # --- テスト（失敗すると以降の build は実行されない） ---
      - name: Unit & integration tests
        if: env.COVERAGE != 'true'
        run: npm test

      - name: Unit & integration tests (with coverage)
        if: env.COVERAGE == 'true'
        run: npm run test:coverage

      - name: Upload coverage report
        if: env.COVERAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            server/coverage/
            client/coverage/
          retention-days: 14

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # --- ビルド（テストが全て通った後にだけ到達する） ---
      - name: Build (server + client)
        run: npm run build
