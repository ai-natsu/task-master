name: Build macOS app

# Mac 用のアプリ（TaskMaster.app）は、Mac 上でしか作れないため、GitHub の macOS 環境で作る。
# 手動で実行する（Actions タブ → Build macOS app → Run workflow）か、v から始まるタグを push すると動く。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (unit and integration)
        run: python -m pytest -q -m "not gui and not e2e"

      - name: Build TaskMaster.app and zip
        run: python packaging/build_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: TaskMaster-mac
          path: packaging/dist/TaskMaster-*-mac.zip
          if-no-files-found: error
