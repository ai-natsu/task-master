name: Build macOS app

# Mac 用のアプリ（TaskMaster.app）は、Mac 上でしか作れないため、GitHub の macOS 環境で作る。
# 手動で実行する（Actions タブ → Build macOS app → Run workflow）か、v から始まるタグを push すると動く。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (unit and integration)
        run: python -m pytest -q -m "not gui and not e2e"

      - name: Build TaskMaster.app and zip
        run: python packaging/build_zip.py

      - name: Smoke test (launch the app and check that it creates its database)
        run: |
          rm -rf /tmp/tm && mkdir /tmp/tm
          ditto -x -k packaging/dist/TaskMaster-*-mac.zip /tmp/tm
          rm -rf "$HOME/Library/Application Support/TaskMaster"
          /tmp/tm/TaskMaster/TaskMaster.app/Contents/MacOS/TaskMaster > /tmp/tm/app.log 2>&1 &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "The app exited early:"; cat /tmp/tm/app.log; exit 1
          fi
          ls -la "$HOME/Library/Application Support/TaskMaster/"
          test -f "$HOME/Library/Application Support/TaskMaster/taskmaster.db"
          kill "$APP_PID"
          cat /tmp/tm/app.log

      - uses: actions/upload-artifact@v4
        with:
          name: TaskMaster-mac
          path: packaging/dist/TaskMaster-*-mac.zip
          if-no-files-found: error
